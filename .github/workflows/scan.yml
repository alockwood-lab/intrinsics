name: Nightly Stock Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run stock scanner
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node .github/scripts/scan.js
      - name: Commit grades.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grades.json
          git diff --cached --quiet || git commit -m "Update stock grades $(date -u +%Y-%m-%d)"
          git push
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly stock scan failed — ' + new Date().toISOString().slice(0, 10),
              body: 'The nightly scan workflow failed.\n\n**Run:** ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['bug']
            });
